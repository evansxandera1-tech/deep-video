name: caverna-video

on:
  workflow_dispatch:
    inputs:
      demo_segundos:
        description: "Segundos a procesar en modo demo (vacío = video completo)"
        required: false
        default: ""

jobs:
  generar-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar rclone y ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone ffmpeg

      - name: Configurar rclone
        run: |
          mkdir -p ~/.config/rclone
          echo "${{ secrets.RCLONE_CONF }}" | base64 -d > ~/.config/rclone/rclone.conf

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr caverna-video
        env:
          GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
          GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
          GROQ_API_KEY_4: ${{ secrets.GROQ_API_KEY_4 }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
          LIMITE_DEMO_SEGUNDOS: ${{ github.event.inputs.demo_segundos }}
        run: python caverna_video.py

      - name: Subir log como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: caverna-video-log
          path: caverna_video.log
